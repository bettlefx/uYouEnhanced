name: Build jailbroken .deb (no IPA, no decryption)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "26.5"
        required: true
        type: string

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: uYouEnhanced tweak (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make wget unzip jq

      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: deb-iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Theos broken pipe issue
        run: |
          find $THEOS -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
            fi
          done
          find $THEOS -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
            fi
          done
          echo "Broken pipe fixes applied"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build Package (${{ matrix.scheme }})
        id: build
        run: |
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            make package JAILBROKEN=1 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            make package JAILBROKEN=1 FINALPACKAGE=1
          fi
          echo "--- packages ---"
          ls -lh packages/
          DEB="$(ls -t packages/*.deb | head -n1)"
          echo "deb=$(basename "$DEB")" >> $GITHUB_OUTPUT
          echo "--- deb metadata ---"
          dpkg-deb -I "$DEB" || true
          echo "--- deb contents (top) ---"
          dpkg-deb -c "$DEB" | head -30 || true
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: uYouEnhanced_tweak_${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
